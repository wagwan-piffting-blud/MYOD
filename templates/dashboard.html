{% extends "index.html" %}

{% block content %}
    <h2>Dashboard</h2>
    <div class="panel">
    <h3>System Status</h3>
    <p>System Online: <span id="system_status" style="{% if system_status == '✓' %}color: green;{% else %}color: red;{% endif %}">{{ system_status }}</span></p>
    <p>Audio Input: <span id="audio_status" style="{% if audio_status == '✓' %}color: green;{% else %}color: red;{% endif %}">{{ audio_status }}</span></p>
    <p>Network Connection: <span id="network_status" style="{% if network_status == '✓' %}color: green;{% else %}color: red;{% endif %}">{{ network_status }}</span></p>
    </div>

    <div class="panel">
        <h3>System Configuration</h3>
        <form action="/switch_style" method="post">
            <div class="form-group">
                <label for="style_select">Display Style:</label>
                <select id="style_select" name="style_index" class="form-control">
                    <option value="0">Style 1 (Original)</option>
                    <option value="1">Style 2 (Black/White)</option>
                    <option value="2">Style 3 (Black/Blue)</option>
                </select>
            </div>
            <button type="submit" class="btn">Apply Style</button>
        </form>
    </div>

    <div class="panel">
        <h3>Message Management</h3>
        <form action="/switch_page" method="post">
            <div class="form-group">
                <label for="page_select">Active Message:</label>
                <select id="page_select" name="page" class="form-control">
                    <option value="default">Default Pages</option>
                    <option value="alert">Alert Pages</option>
                </select>
            </div>
            <button type="submit" class="btn">Load Message</button>
        </form>
    </div>

    <div class="panel">
        <h3>System Control</h3>
        <form action="/quit" method="post">
            <button type="submit" class="btn">CG Shutdown</button>
        </form>
    </div>

    <script>
        system_status = document.getElementById("system_status");
        audio_status = document.getElementById("audio_status");
        network_status = document.getElementById("network_status");

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    system_status.innerText = data.system_status;
                    system_status.style.color = data.system_status === '✓' ? 'green' : 'red';
                    audio_status.innerText = data.audio_status;
                    audio_status.style.color = data.audio_status === '✓' ? 'green' : 'red';
                    network_status.innerText = data.network_status;
                    network_status.style.color = data.network_status === '✓' ? 'green' : 'red';
                })
                .catch(error => {
                    console.error('Error fetching status:', error);
                    system_status.innerText = '✕';
                    system_status.style.color = 'red';
                    audio_status.innerText = '✕';
                    audio_status.style.color = 'red';
                    network_status.innerText = '✕';
                    network_status.style.color = 'red';
                });
        }

        setInterval(updateStatus, 1000);
    </script>
{% endblock %}
